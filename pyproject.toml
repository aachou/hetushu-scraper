[project]
name = "hetushu-scraper"
version = "0.2.1"
description = "抓取和图书网站上的小说并生成 epub 电子书。"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cloakbrowser>=0.3.31",
    "ebooklib>=0.20",
    "tqdm>=4.68.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
